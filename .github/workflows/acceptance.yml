name: Acceptance
# The title names the attempt and its commit, so a reader (and Verified's observer) can find the run.
run-name: acceptance ${{ inputs.challenge }} ${{ inputs.attempt }} ${{ inputs.head }}
on:
  workflow_dispatch:
    inputs:
      challenge:
        description: Challenge
        required: true
        type: choice
        options: [invoice-dedup]
      attempt:
        description: Attempt identifier (as Verified registered it)
        required: true
        type: string
      head:
        description: The submitted commit (40 hex digits)
        required: true
        type: string
# Read-only, no secrets: the job holds nothing the submitted code could use.
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHALLENGE: ${{ inputs.challenge }}
      ATTEMPT: ${{ inputs.attempt }}
      HEAD_SHA: ${{ inputs.head }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the inputs
        run: |
          [[ "$ATTEMPT" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "bad attempt"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad head"; exit 1; }
      - name: Fetch the submitted commit by SHA, never a branch
        run: |
          repo=$(cat "challenges/$CHALLENGE/repository")
          git init -q "$RUNNER_TEMP/submission"
          git -C "$RUNNER_TEMP/submission" fetch -q --depth=1 "https://github.com/$repo.git" "$HEAD_SHA"
          test "$(git -C "$RUNNER_TEMP/submission" rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          echo "REPOSITORY=$repo" >> "$GITHUB_ENV"
          echo "TREE=$(git -C "$RUNNER_TEMP/submission" rev-parse 'FETCH_HEAD^{tree}')" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/src"
          git -C "$RUNNER_TEMP/submission" archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/src"
      - name: Run the probe on the submission, isolated
        run: |
          image=$(cat "challenges/$CHALLENGE/image")
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker pull -q "$image" > /dev/null
          status=answered
          timeout 120 docker run --rm -i --network none --read-only --tmpfs /tmp:size=16m \
            --memory 256m --memory-swap 256m --cpus 1 --pids-limit 64 --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            -v "$RUNNER_TEMP/src:/work/src:ro" -v "$PWD/challenges/$CHALLENGE/probe.py:/work/probe.py:ro" \
            "$image" python -I -B /work/probe.py < "challenges/$CHALLENGE/inputs.json" \
            > "$RUNNER_TEMP/probe.out" || { [ $? -eq 124 ] && status=timed-out; }
          echo "STATUS=$status" >> "$GITHUB_ENV"
      - name: Answers
        run: python3 tooling/answers.py "$CHALLENGE" "$ATTEMPT" "$REPOSITORY" "$HEAD_SHA" "$TREE" "$IMAGE" "$STATUS" "$RUNNER_TEMP/probe.out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: answers
          path: answers.json
          if-no-files-found: error
          retention-days: 90
